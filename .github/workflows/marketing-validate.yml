name: Marketing validation

on:
  push:
    paths:
      - ".agents/skills/**"
      - ".claude/**"
      - "marketing/**"
      - "scripts/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "AGENTS.md"
      - "README.md"
      - "docs/ai/skills-management.md"
      - "scripts/README.md"
      - "tasks/build-in-public-marketing.md"
      - ".github/workflows/marketing-validate.yml"
  pull_request:
    paths:
      - ".agents/skills/**"
      - ".claude/**"
      - "marketing/**"
      - "scripts/marketing/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "AGENTS.md"
      - "README.md"
      - "docs/ai/skills-management.md"
      - "scripts/README.md"
      - "tasks/build-in-public-marketing.md"
      - ".github/workflows/marketing-validate.yml"

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.19.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm marketing:test
      - run: pnpm marketing validate marketing/build-in-public --json
